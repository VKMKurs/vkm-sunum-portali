<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. Sınıf Sunumu — Canva Canlı</title>
    <!--
        Canva CANLI EMBED (resmî embed kodu).
        Canva tasarımındaki her değişiklik bu sayfaya OTOMATİK yansır.

        Tasarım: "Vaditepe 7.Sınıf Sunumu"
        Design ID: DAGgqRDhh3U
        Not: Paylaşım ayarı "Bağlantısı olan herkes görüntüleyebilir" olmalı.
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
        body {
            display: flex; align-items: center; justify-content: center;
            font-family: 'Nunito', 'Segoe UI', sans-serif;
        }
        /* 16:9 sahne — ekranı taşmadan en büyük 16:9 alanı kaplar */
        .stage {
            position: relative; width: 100%; height: 100%;
            max-width: calc(100vh * 16 / 9);
            max-height: calc(100vw * 9 / 16);
            margin: auto;
        }
        .embed-frame {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: 0; background: #0d1117;
        }
        .fallback {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px;
            color: #fff; text-align: center; padding: 24px; background: #0d1117;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .fallback.show { opacity: 1; pointer-events: auto; }
        .fallback .logo {
            width: 90px; height: 90px; border-radius: 50%;
            background: #e31e1b; color: #fff; font-weight: 800; font-size: 30px;
            display: flex; align-items: center; justify-content: center; border: 4px solid #fff;
        }
        .fallback p { font-size: 18px; opacity: 0.85; max-width: 460px; }
        .fallback a {
            background: #e31e1b; color: #fff; text-decoration: none;
            padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 18px;
        }
        .loader {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; background: #0d1117;
            transition: opacity 0.4s;
        }
        .loader.hide { opacity: 0; pointer-events: none; }
        .spinner {
            width: 56px; height: 56px;
            border: 5px solid rgba(255,255,255,0.15);
            border-top-color: #e31e1b; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="stage">
        <iframe
            id="canvaFrame"
            class="embed-frame"
            src="https://www.canva.com/design/DAGgqRDhh3U/7o8ueOqTRoo36qmaJeqqWA/view?embed"
            allow="fullscreen; autoplay"
            allowfullscreen
            loading="eager"
            referrerpolicy="strict-origin-when-cross-origin"
            title="7. Sınıf Sunumu"></iframe>

        <div class="loader" id="loader"><div class="spinner"></div></div>

        <div class="fallback" id="fallback">
            <div class="logo">VKM</div>
            <p>Sunum yüklenemedi. İnternet bağlantısını kontrol edip aşağıdaki butondan Canva'da açabilirsiniz.</p>
            <a href="https://www.canva.com/design/DAGgqRDhh3U/7o8ueOqTRoo36qmaJeqqWA/view" target="_blank" rel="noopener">Canva'da Aç ↗</a>
        </div>
    </div>

    <script>
        const frame = document.getElementById('canvaFrame');
        const loader = document.getElementById('loader');
        const fallback = document.getElementById('fallback');
        frame.addEventListener('load', () => loader.classList.add('hide'));
        setTimeout(() => {
            if (!loader.classList.contains('hide')) {
                loader.classList.add('hide');
                fallback.classList.add('show');
            }
        }, 12000);
    </script>
</body>
</html>
